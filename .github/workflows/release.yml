name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: wisp

jobs:
  # ── 1. Create the GitHub Release shell up-front so other jobs can upload to it
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag"           >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"   >> "$GITHUB_OUTPUT"

      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            || gh release create "${{ steps.meta.outputs.tag }}" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "wisp ${{ steps.meta.outputs.version }}" \
                 --generate-notes \
                 --draft

  # ── 2. Build per-target binaries and upload to the release
  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os:    ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os:    ubuntu-latest
            musl:  true
          - target: aarch64-unknown-linux-gnu
            os:    ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}" --package wisp-cli
          else
            cargo build --release --locked --target "${{ matrix.target }}" --package wisp-cli
          fi

      - name: Stage artifacts
        run: |
          version="${{ needs.create-release.outputs.version }}"
          stage="$BIN_NAME-$version-${{ matrix.target }}"
          mkdir -p "dist/$stage"

          cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$stage/"
          cp README.md CONTRIBUTING.md "dist/$stage/" 2>/dev/null || true

          # Generate completions and man via the freshly-built binary (skip for cross)
          if [ -z "${{ matrix.cross }}" ]; then
            mkdir -p "dist/$stage/completions"
            "dist/$stage/$BIN_NAME" completion bash > "dist/$stage/completions/$BIN_NAME.bash" || true
            "dist/$stage/$BIN_NAME" completion zsh  > "dist/$stage/completions/_$BIN_NAME"      || true
            "dist/$stage/$BIN_NAME" completion fish > "dist/$stage/completions/$BIN_NAME.fish" || true
            "dist/$stage/$BIN_NAME" man             > "dist/$stage/$BIN_NAME.1"                || true
          fi

          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          (cd dist && sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256")
          echo "ASSET=dist/$stage.tar.gz"        >> "$GITHUB_ENV"
          echo "ASSET_SHA=dist/$stage.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$ASSET" "$ASSET_SHA" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ── 3. Publish the release once all builds succeed
  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --draft=false
