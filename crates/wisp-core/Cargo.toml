[package]
name         = "wisp-core"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true
description  = "L2 – Core types, FS abstractions and cross-cutting utilities for wisp"
homepage     = "https://github.com/chiiydd/wisp"
documentation = "https://docs.rs/wisp-core"
readme       = "README.md"
keywords     = ["disk", "cleanup", "filesystem", "trash", "scanner"]
categories   = ["filesystem", "command-line-utilities"]

[dependencies]
wisp-platform = { workspace = true }

# Data types
compact_str = { workspace = true }
smallvec    = { workspace = true }
slotmap     = { workspace = true }
uuid        = { workspace = true }
camino      = { workspace = true }

# Serialization
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }

# Error handling
thiserror   = { workspace = true }

# OS paths
directories = { workspace = true }

# Utilities
humansize   = { workspace = true }
trash       = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true }
jwalk       = { workspace = true }
rayon       = { workspace = true }

[lints]
workspace = true
