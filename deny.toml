[advisories]
version = 2
yanked  = "warn"
# Transitive "unmaintained" advisories with no fix available; the upstreams
# are EOL but the crates still work and have no known vulnerabilities.
ignore = [
    "RUSTSEC-2024-0436",  # paste — pulled in by ratatui
    "RUSTSEC-2025-0057",  # fxhash — pulled in transitively
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",  # file-level copyleft only; pulled in by `dirs` -> `option-ext`
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "Zlib",
]
# cargo-deny v2 is allow-list only — anything not in `allow` is denied.
# Copyleft licenses (GPL-*, LGPL-*, AGPL-*) are intentionally absent and
# will fail the check if any dependency pulls them in.

[bans]
multiple-versions = "warn"
wildcards         = "allow"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
